ime</b><br>&quot;Highest crime first&quot;: the bottom of the ranking, with orange markers in the centre. <span class="note">(07_safety_highest_crime_first.png)</span></figcaption><img id="s4" alt="Which areas have the most crime" style="width:1200px"></figure><figure><figcaption><b>5. Affluence: land values + income</b><br>Grunewald (#19): status index, land-value index 94, typical land value €2,700/m² (context), income shown Berlin-wide only (€45,161, 2022). <span class="note">(09_affluence_land_values_income.png)</span></figcaption><img id="s5" alt="Affluence: land values + income" style="width:1200px"></figure><figure><figcaption><b>6. Your own weights</b><br>&quot;What matters to you?&quot;: after &quot;Update ranking&quot; the overall order and map change; the weights are kept in the URL. <span class="note">(14_weighted_ranking_after_update.png)</span></figcaption><img id="s6" alt="Your own weights" style="width:1200px"></figure><figure><figcaption><b>7. Mobile</b><br>Phone layout: map above the list; tapping Müggelheim on the map opens its detail. <span class="note">(17_mobile_map_tap_detail.png)</span></figcaption><img id="s7" alt="Mobile" style="width:520px"></figure><script>
